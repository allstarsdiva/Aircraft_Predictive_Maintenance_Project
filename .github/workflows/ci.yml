name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test:frontend
      - name: Build production frontend
        run: npm run build
      - name: Upload built frontend for gated delivery
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend syntax and independent API tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14.7
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check Python source syntax
        run: python -m compileall -q src
      - name: Run backend tests that need no local model/data artifacts
        run: >-
          python -m pytest -q -p no:cacheprovider
          tests/test_api_security.py
          tests/test_prediction_history_api.py

  deliver:
    name: Publish verified frontend artifact
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - name: Download tested frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: site/
      - name: Publish CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: aircraft-dashboard-${{ github.sha }}
          path: site/
          if-no-files-found: error
          retention-days: 14
